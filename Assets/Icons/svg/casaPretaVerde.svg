<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncR type="linear" slope="0"/><feFuncG type="linear" slope="1.5"/><feFuncB type="linear" slope="0"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow-green)">
    <polyline points="10,55 50,20 90,55" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="50,20 20,46 20,85 80,85 80,46" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/>
    <rect x="40" y="55" width="20" height="30" fill="none" stroke="#1A1A1A" stroke-width="5"/>
  </g>
</svg>
